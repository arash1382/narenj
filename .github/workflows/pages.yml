name: Deploy Naranj preview to GitHub Pages

on:
  push:
    branches:
      - arena/dafb13f8-narenj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current Naranj branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static app for the repository URL
        run: npm run build
        env:
          NARANJ_BASE_PATH: /narenj
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
